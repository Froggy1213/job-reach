name: job-reach
version: "2.5.0"
description: >-
  Search Japanese job boards (Wantedly, Indeed, Green, Daijob, Japan Dev,
  Mynavi 2027, LinkedIn) and track which listings are new since the last run.
  Ships LLM-callable tools for searching, ingesting hand-fetched listings,
  writing Obsidian notes, and scheduling recurring monitoring through hermes cron.
author: Froggy1213
license: MIT
homepage: https://github.com/Froggy1213/job-reach
manifest_version: 2
requires_hermes: ">=0.21"
kind: standalone

# Where this plugin runs. The engine is standard-library Python, the browser
# work is delegated to Scrapling/Playwright (both cross-platform), and the cron
# monitor script is generated as Python, so all three desktop platforms are
# supported — see the README's "Requirements & platform support".
platforms:
  - macos
  - linux
  - windows

# Nothing to install: the engine imports only the standard library. The browser
# stack that two of the seven boards need is looked up at run time (Scrapling,
# or the venv `job_setup` builds) and is deliberately NOT a plugin dependency —
# declared here only so the answer to "does this pull in packages?" is explicit.
python_dependencies: []

tags:
  - jobs
  - career
  - japan
  - scraping
  - search
  - obsidian

# Nothing is mandatory: the plugin installs and runs its read-only tools with
# no configuration at all. These are the knobs worth knowing about.
requires_env: []
optional_env:
  - name: JOBREACH_HOME
    description: "Data directory (database + optional scraping venv). Default: $HERMES_HOME/plugin-data/job-reach"
  - name: JOBREACH_DB
    description: "Explicit path to the SQLite database file."
  - name: JOBREACH_PYTHON
    description: "Interpreter used to run the engine. Point this at a Python with playwright installed if you manage the venv yourself."
  - name: JOBREACH_BACKEND
    description: "Browser backend: 'auto' (default), 'scrapling' or 'playwright'. Pinning it is how you debug one against the other."
  - name: JOBREACH_SCRAPLING_PYTHON
    description: "Interpreter that has Scrapling installed (the preferred backend). Auto-detected from a `scrapling` binary on PATH, the plugin venv, and known local installs."
  - name: JOBREACH_UV
    description: "Path to the uv binary used by `job_setup` to create the scraping venv."
  - name: OBSIDIAN_VAULT_PATH
    description: "Obsidian vault that job notes are written into. Auto-detected when unset."
  - name: JOBREACH_LLM_API_KEY
    description: "Key for LLM-based relevance filtering (job_search with validation='llm'). Falls back to DEEPSEEK_API_KEY, then OPENAI_API_KEY."
  - name: JOBREACH_LLM_BASE_URL
    description: "OpenAI-compatible base URL for LLM filtering. Required when using the generic JOBREACH_LLM_API_KEY."
  - name: JOBREACH_LLM_MODEL
    description: "Model for LLM filtering. Defaults to the one implied by whichever API key was found."
  - name: DEEPSEEK_API_KEY
    description: "DeepSeek key for LLM filtering; implies api.deepseek.com and deepseek-chat."
  - name: OPENAI_API_KEY
    description: "OpenAI key for LLM filtering; implies api.openai.com and gpt-4o-mini."

external_dependencies:
  - name: scrapling
    description: "Preferred browser backend — a stealth browser that solves Cloudflare challenges (https://github.com/D4Vinci/Scrapling). Auto-detected; when present, `job_setup` downloads nothing."
    optional: true
  - name: uv
    description: "Used once by `job_setup` to create the Playwright fallback venv (https://astral.sh/uv). Hermes already bundles a copy."
    optional: true
  - name: opencli
    description: "Required only for the LinkedIn board; drives the user's Chrome session with the OpenCLI extension."
    optional: true

provides_tools:
  - job_search
  - job_ingest
  - job_list
  - job_note
  - job_status
  - job_setup
  - job_cron

# The one hook this plugin subscribes to: it records this plugin's own tool
# calls (dump path, counts, outcome) so `job_status` can report what actually
# ran. Every other tool call is ignored; the callback never raises.
provides_hooks:
  - post_tool_call

# User-visible settings, resolved by Hermes under
# `plugins.entries.job-reach.settings`. The plugin reads them through
# `ctx.get_config` on every tool call and forwards them to the engine
# subprocess through `jobreach.settings` — an explicit tool argument always
# wins, and a key left out means "use the default below".
config_schema:
  default_keyword:
    type: str
    required: false
    default: ""
    description: "Query used when the caller passes no keyword. Empty means the built-in design feed."
  default_sources:
    type: list
    required: false
    default: []
    description: "Boards searched by default. Defaults to [wantedly, mynavi2027, linkedin]."
  note_subfolder:
    type: str
    required: false
    default: "job-searches"
    description: "Subfolder inside the Obsidian vault for generated notes. Default: job-searches"
  max_results:
    type: int
    required: false
    default: 25
    # Deliberately a *default*, not a ceiling: an explicit `limit` is obeyed.
    # It applies to `job_list` only. `job_search` passes no `-n` at all when
    # neither the caller nor this setting supplies one, which is what the
    # engine's "omit for all" means — so a fresh install returns every match,
    # and setting this is how a user caps that.
    description: >-
      How many listings job_list returns when the caller passes no limit, and
      the limit job_search falls back to. Unset means the engine's own default
      (all matches for a search). An explicit `limit` argument always wins.
  default_validation:
    type: str
    required: false
    default: "off"
    # Deliberately a *default*: a bare search stays unfiltered until the user
    # asks otherwise, so an existing install's results do not change size
    # without one. Setting it to 'local' is what makes the cheap, relevant
    # answer the default one.
    description: >-
      Relevance filter used when the caller passes neither `validation` nor
      `--validate`: 'off' (default) returns every match, 'local' drops the
      obvious noise with free regex heuristics, 'llm' classifies against the
      profile below and needs an API key. An explicit argument or flag always
      wins.
  default_profile:
    type: str
    required: false
    default: "designer"
    description: >-
      Filter profile used when the caller passes neither `profile` nor
      `--profile`: designer (default), frontend, engineering, product or any.
      It only has an effect while relevance filtering is on (a 'local' or 'llm'
      validation); an explicit argument or flag always wins.
