[project]
name = "job-reach-hermes"
version = "2.5.1"
description = "Hermes Agent plugin: search Japanese job boards and track new listings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Froggy1213" }]
keywords = ["hermes-agent", "plugin", "jobs", "japan", "scraping", "career"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# The engine core (`jobreach/`) is standard-library only, so the plugin can be
# imported and used by Hermes' own runtime without installing anything.
dependencies = []

[project.optional-dependencies]
# Preferred browser backend: stealth fetching (Cloudflare solving) without
# building a venv of our own. `job_setup` looks for an existing install first;
# this extra is here for the case where you want one inside the plugin venv.
scrapling = [
    "scrapling[fetchers]>=0.4,<0.5",
]
# Fallback browser backend, used only when Scrapling is not available.
# `job_setup` installs these into a dedicated venv; never into Hermes' venv.
scrape = [
    "playwright>=1.50,<2.0",
    "playwright-stealth>=2.0.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/Froggy1213/job-reach"
Source = "https://github.com/Froggy1213/job-reach"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--confcutdir=tests` is load-bearing, not tidiness. The repository root holds
# the Hermes plugin entry point (`__init__.py`), which makes the root look like a
# Python package. Since pytest 8.4 it collects the rootdir as a `Package` and
# imports that `__init__.py` as a test module; the import only succeeds when the
# checkout directory happens to be a valid identifier (`Job_reach` is,
# `job-reach` — the name `git clone` uses — is not), and when it is not, the run
# dies with 592 collection errors about `from .tools import …` having no parent
# package. Bounding the conftest cut directory to `tests/` keeps every ancestor
# out of pytest's import machinery. It is resolved against the invocation
# directory, so run pytest from the repository root; a future root-level
# `conftest.py` would no longer be loaded (there is none today).
addopts = "-q --confcutdir=tests"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
